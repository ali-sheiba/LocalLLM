# Qwen3.6-27B — dual 3090, PCIe (NO NVLink)
services:
  vllm-qwen36-27b-dual:
    image: vllm/vllm-openai:v0.25.1
    container_name: local-llm-qwen3.6-27b-autoround-int4-update-vllm
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ${MODEL_ROOT:-${HOME}/models}/Lorbus/Qwen3.6-27B-int4-AutoRound:/models/qwen36-27b-autoround-int4:ro
      - ${VLLM_CACHE_ROOT:-${HOME}/.cache/LocalLLM/vllm}/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ${VLLM_CACHE_ROOT:-${HOME}/.cache/LocalLLM/vllm}/triton:/root/.triton/cache
      - ${MODEL_ROOT:-${HOME}/models}/froggeric/Qwen-Fixed-Chat-Templates/chat_template.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
    environment:
      # - NCCL_P2P_DISABLE=1        # A/B #1 — try commented out first
      - NCCL_CUMEM_ENABLE=0
      - NCCL_DEBUG=WARN
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0,1
      - OMP_NUM_THREADS=4
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_NO_USAGE_STATS=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    entrypoint: ["vllm", "serve"]
    command:
      - --model=/models/qwen36-27b-autoround-int4
      - --served-model-name=qwen3.6-27b
      - --dtype=float16
      - --quantization=auto_round
      - --trust-remote-code
      - --tensor-parallel-size=2
      # - --disable-custom-all-reduce   # A/B #1 — pairs with NCCL_P2P_DISABLE
      - --max-model-len=131072
      - --kv-cache-dtype=fp8_e4m3
      - --max-num-seqs=16
      - --max-num-batched-tokens=16384
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --chat-template=/etc/qwen-froggeric-chat-template.jinja
      - '--default-chat-template-kwargs={"enable_thinking": false}'
      - '--speculative-config={"method":"mtp","num_speculative_tokens":2}'
      - '--override-generation-config={"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"repetition_penalty":1.0}'
      - --gpu-memory-utilization=0.92
      - --host=0.0.0.0
      - --port=8000

services:
    llamacpp-embed-cpu:
        image: ghcr.io/ggml-org/llama.cpp:server
        container_name: local-llm-llama-embed-default-llama-cpp
        restart: unless-stopped
        ports:
            - "8082:8082"
        networks:
            - embed-net
        volumes:
            - ${MODEL_ROOT:-${HOME}/models}/nomic-ai/nomic-embed-text-v2-moe-GGUF:/models:ro
        command: >
            --model /models/nomic-embed-text-v2-moe.Q6_K.gguf
            --alias nomic-embed-text-v2-moe
            --embedding
            --pooling mean
            --host 0.0.0.0
            --port 8082
            --threads 16
            --threads-batch 16
            --ctx-size 512
            --batch-size 512
            --ubatch-size 512
            --load-mode none
            --numa distribute
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        deploy:
            replicas: 1
            resources:
                limits:
                    cpus: "16"
                    memory: 8g
                reservations:
                    memory: 4g
        environment:
            - GGML_CUDA_NO_PINNED=1

networks:
    embed-net:
        driver: bridge

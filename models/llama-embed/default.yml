services:
    llamacpp-embed-cpu:
        image: ghcr.io/ggml-org/llama.cpp:server
        restart: unless-stopped
        ports:
            - "8082:8082"
        networks:
            - embed-net
        volumes:
            - /models/nomic-ai/nomic-embed-text-v1.5-GGUF:/models:ro
        command: >
            --model /models/nomic-embed-text-v1.5.Q8_0.gguf
            --embedding
            --pooling mean
            --host 0.0.0.0
            --port 8082
            --threads 12
            --threads-batch 12
            --ctx-size 8192
            --batch-size 2048
            --ubatch-size 512
            --no-mmap
            --numa distribute
        deploy:
            replicas: 3
            resources:
                limits:
                    cpus: "14"
                    memory: 8g
                reservations:
                    memory: 4g
        environment:
            - GGML_CUDA_NO_PINNED=1

networks:
    embed-net:
        driver: bridge

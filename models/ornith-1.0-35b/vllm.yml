services:
    vllm:
        image: vllm/vllm-openai:latest
        container_name: ornith-1.0-35b
        restart: unless-stopped
        ports:
            - "8080:8000"
        volumes:
            - /models/deepreinforce-ai/Ornith-1.0-35B-FP8:/models/Ornith-1.0-35B-FP8:ro
            - /home/app/cache/vllm/torch_compile:/root/.cache/vllm/torch_compile_cache
            - /home/app/cache/vllm/triton:/root/.triton/cache
        environment:
            - NCCL_CUMEM_ENABLE=0
            - NCCL_P2P_DISABLE=1
            - NVIDIA_VISIBLE_DEVICES=all
            - OMP_NUM_THREADS=1
            - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
            - VLLM_NO_USAGE_STATS=1
            - VLLM_USE_FLASHINFER_SAMPLER=1
            - VLLM_WORKER_MULTIPROC_METHOD=spawn
        shm_size: "16gb"
        ipc: host
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

        command:
            - --model=/models/Ornith-1.0-35B-FP8
            - --served-model-name=ornith-1.0-35b
            - --tensor-parallel-size=2
            - --max-model-len=131072
            - --gpu-memory-utilization=0.90
            - --enable-prefix-caching
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_xml
            - --reasoning-parser=qwen3
            - --trust-remote-code
            - --host=0.0.0.0
            - --port=8000

services:
  llama-cpp-qwen36-35b-a3b:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: local-llm-qwen3.6-35b-uncensored-llama-cpp
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${MODEL_ROOT:-${HOME}/models}/HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive:/models:ro
    command: >-
      --host 0.0.0.0
      --port 8080
      -m /models/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q6_K_P.gguf
      --alias qwen3.6-35b-a3b
      -c ${CTX_SIZE:-524288}
      -ngl 99
      -fa on
      -np ${NP:-2}
      --jinja
      --reasoning ${REASONING:-off}
      --reasoning-format ${REASONING_FORMAT:-deepseek}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

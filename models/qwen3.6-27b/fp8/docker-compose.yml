# vLLM — Qwen3.6-27B FP8 (official Qwen quant) — Dual RTX 3090, TP=2, PCIe-only
# VRAM: ~14.5GB weights/card + ~9GB KV/card @ 0.92 util = fits 24GB cleanly
services:
  vllm-qwen36-27b:
    image: vllm/vllm-openai:latest
    container_name: local-llm-qwen3.6-27b-fp8-vllm
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ${MODEL_ROOT:-${HOME}/models}/Qwen/Qwen3.6-27B-FP8:/models/Qwen3.6-27B-FP8:ro
      - ${VLLM_CACHE_ROOT:-${HOME}/.cache/LocalLLM/vllm}/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ${VLLM_CACHE_ROOT:-${HOME}/.cache/LocalLLM/vllm}/triton:/root/.triton/cache
      - ${MODEL_ROOT:-${HOME}/models}/froggeric/Qwen-Fixed-Chat-Templates/chat_template.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
    environment:
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - NVIDIA_VISIBLE_DEVICES=all
      - OMP_NUM_THREADS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - VLLM_NO_USAGE_STATS=1
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    command:
      - --model=/models/Qwen3.6-27B-FP8
      - --served-model-name=qwen3.6-27b
      - --dtype=bfloat16
      - --max-num-seqs=2
      - --quantization=fp8
      - --trust-remote-code
      - --max-model-len=262144
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --reasoning-parser=qwen3
      - --tensor-parallel-size=2
      - --enable-auto-tool-choice
      - --disable-custom-all-reduce
      - --gpu-memory-utilization=0.92
      - --max-num-batched-tokens=8192
      - --tool-call-parser=qwen3_coder
      - --kv-cache-dtype=int8_per_token_head
      - --chat-template=/etc/qwen-froggeric-chat-template.jinja
      - '--default-chat-template-kwargs={"enable_thinking": false}'
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      - '--override-generation-config={"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"repetition_penalty":1.0}'
      - --host=0.0.0.0
      - --port=8000

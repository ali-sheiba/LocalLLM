# Qwen3.6-27B — dual 3090, PCIe (NO NVLink). Standalone port of club-3090
# vllm/dual (Lorbus/Qwen3.6-27B-int4-AutoRound).
services:
  vllm-qwen36-27b-dual:
    # image: vllm/vllm-openai:v0.22.0
    image: vllm/vllm-openai:v0.25.1
    container_name: local-llm-qwen3.6-27b-autoround-int4-vllm
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ${MODEL_ROOT:-${HOME}/models}/Lorbus/Qwen3.6-27B-int4-AutoRound:/models/qwen36-27b-autoround-int4:ro
      - ${VLLM_CACHE_ROOT:-${HOME}/.cache/LocalLLM/vllm}/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ${VLLM_CACHE_ROOT:-${HOME}/.cache/LocalLLM/vllm}/triton:/root/.triton/cache
      # - ${MODEL_ROOT:-${HOME}/models}/froggeric/Qwen-Fixed-Chat-Templates/chat_template.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
      - ${MODEL_ROOT:-${HOME}/models}/templates/qwen3.6-froggeric-v21.3.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
    environment:
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - NVIDIA_VISIBLE_DEVICES=all
      - OMP_NUM_THREADS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - VLLM_NO_USAGE_STATS=1
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - CUDA_VISIBLE_DEVICES
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    entrypoint: ["vllm", "serve"]
    command:
      - --model=/models/qwen36-27b-autoround-int4
      - --served-model-name=qwen3.6-27b
      - --dtype=float16
      - --max-num-seqs=2
      - --trust-remote-code
      - --max-model-len=262144
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --reasoning-parser=qwen3
      - --tensor-parallel-size=2
      - --quantization=auto_round
      - --kv-cache-dtype=fp8_e5m2
      - --enable-auto-tool-choice
      - --pipeline-parallel-size=1
      - --disable-custom-all-reduce
      - --gpu-memory-utilization=0.92
      - --max-num-batched-tokens=8192
      - --tool-call-parser=qwen3_coder
      - --chat-template=/etc/qwen-froggeric-chat-template.jinja
      - '--default-chat-template-kwargs={"enable_thinking": false}'
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      - '--override-generation-config={"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"repetition_penalty":1.0}'
      - --host=0.0.0.0
      - --port=8000

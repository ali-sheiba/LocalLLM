services:
  llama-cpp-qwen38-27b-mtp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-qwen38-27b
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /home/app/models/unsloth/Qwen3.8-27B-GGUF:/models:ro
      - /home/app/models/froggeric/Qwen-Fixed-Chat-Templates/chat_template.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
    command: >-
      --host 0.0.0.0
      --port 8080
      -m /models/${MODEL:-Qwen3.8-27B-UD-Q8_K_XL.gguf}
      --alias qwen3.8-27b
      -c ${CTX_SIZE:-262144}
      -b ${BATCH_SIZE:-4096}
      -ub ${UBATCH_SIZE:-512}
      -ngl 99
      --split-mode layer
      --tensor-split 0.55,0.45
      -fa on
      --cache-type-k ${KV_TYPE:-q8_0}
      --cache-type-v ${KV_TYPE:-q8_0}
      -np ${NP:-1}
      --jinja
      --chat-template-file /etc/qwen-froggeric-chat-template.jinja
      --reasoning ${REASONING:-off}
      --reasoning-format ${REASONING_FORMAT:-deepseek}
      --reasoning-preserve
      --spec-type draft-mtp
      --spec-draft-n-max ${MTP_DRAFT_N_MAX:-2}
      --temp ${TEMP:-0.7}
      --top-p ${TOP_P:-0.80}
      --top-k ${TOP_K:-20}
      --min-p ${MIN_P:-0.0}
      --presence-penalty 1.5
      --repeat-penalty ${REPEAT_PENALTY:-1.0}
      --metrics
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# vLLM — Qwen3.8-27B AutoRound INT4 — dual RTX 3090 (TP=2, PCIe-only)
#
# Set MODEL_HOST_PATH to evaluate another author's AutoRound checkpoint. The
# benchmark runner records the resolved bind mount and container command, so the
# checkpoint, template, and tuning values remain attributable to each run.
services:
  vllm-qwen38-27b-autoround-int4:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1}
    container_name: ${CONTAINER_NAME:-local-llm-qwen3.8-27b-autoround-int4-vllm}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8000"
    volumes:
      # Keep this destination stable: helpers/run-benchmark.py identifies model
      # provenance from mounts below /models.
      - ${MODEL_HOST_PATH:-${MODEL_ROOT:-${HOME}/models}/MKRWW/Qwen3.8-27B-int4-AutoRound}:/models/model:ro
      - ${CUSTOM_CHAT_TEMPLATE_HOST_PATH:-${MODEL_ROOT:-${HOME}/models}/froggeric/Qwen-Fixed-Chat-Templates/chat_template.jinja}:/etc/qwen-custom-chat-template.jinja:ro
      - ${VLLM_CACHE_ROOT:-${HOME}/.cache/LocalLLM/vllm}/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ${VLLM_CACHE_ROOT:-${HOME}/.cache/LocalLLM/vllm}/triton:/root/.triton/cache
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0,1}
      NVIDIA_VISIBLE_DEVICES: all
      NCCL_P2P_DISABLE: "${NCCL_P2P_DISABLE:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-1}"
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,max_split_size_mb:512}
      VLLM_NO_USAGE_STATS: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "${VLLM_USE_FLASHINFER_SAMPLER:-0}"
      VLLM_WORKER_MULTIPROC_METHOD: ${VLLM_WORKER_MULTIPROC_METHOD:-spawn}
      # Empty preserves model-config quantization and disables MTP. Profiles can
      # explicitly request a backend quantization name and/or built-in MTP depth.
      QUANTIZATION: "${QUANTIZATION:-}"
      MTP_K: "${MTP_K:-}"
    shm_size: "${SHM_SIZE:-16gb}"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    entrypoint:
      - bash
      - -ec
      - |
        extra_args=()
        if [ -n "$${QUANTIZATION:-}" ]; then
          extra_args+=(--quantization "$${QUANTIZATION}")
        fi
        if [ -n "$${MTP_K:-}" ]; then
          case "$${MTP_K}" in
            *[!0-9]*)
              echo "MTP_K must be a non-negative integer (or unset)." >&2
              exit 2
              ;;
          esac
          if [ "$${MTP_K}" -gt 0 ]; then
            extra_args+=(--speculative-config "{\"method\":\"mtp\",\"num_speculative_tokens\":$${MTP_K}}")
          fi
        fi
        exec vllm serve "$${@}" "$${extra_args[@]}"
      - --
    command:
      - --model=/models/model
      - --served-model-name=${SERVED_MODEL_NAME:-qwen3.8-27b}
      - --trust-remote-code
      - --dtype=${DTYPE:-bfloat16}
      # Let each author's config.json select its AutoRound packing format unless
      # the profile declares the vLLM quantization spelling explicitly.

      - --max-model-len=${MAX_MODEL_LEN:-262144}
      - --max-num-seqs=${MAX_NUM_SEQS:-2}
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.92}
      - --kv-cache-dtype=${KV_CACHE_DTYPE:-int8_per_token_head}

      # Prefix cache and Mamba recurrent state must be configured together.
      - "${PREFIX_CACHE_ARG:---enable-prefix-caching}"
      - --mamba-cache-mode=${MAMBA_CACHE_MODE:-align}
      - "${CHUNKED_PREFILL_ARG:---enable-chunked-prefill}"
      - --max-num-batched-tokens=${MAX_NUM_BATCHED_TOKENS:-8192}
      - "${ASYNC_SCHEDULING_ARG:---async-scheduling}"

      - --tensor-parallel-size=${TENSOR_PARALLEL_SIZE:-2}
      - --pipeline-parallel-size=${PIPELINE_PARALLEL_SIZE:-1}
      - "${CUSTOM_ALL_REDUCE_ARG:---disable-custom-all-reduce}"

      - "${AUTO_TOOL_CHOICE_ARG:---enable-auto-tool-choice}"
      - --tool-call-parser=${TOOL_PARSER:-qwen3_coder}
      - --reasoning-parser=${REASONING_PARSER:-qwen3}
      # Default: the template included by the selected model. To evaluate the
      # froggeric template set CHAT_TEMPLATE=/etc/qwen-custom-chat-template.jinja.
      - --chat-template=${CHAT_TEMPLATE:-/models/model/chat_template.jinja}
      - '--default-chat-template-kwargs={"enable_thinking": ${ENABLE_THINKING:-false}, "reasoning_effort": "${REASONING_EFFORT:-low}"}'
      - '--limit-mm-per-prompt={"image":${MAX_IMAGES_PER_PROMPT:-2},"video":0}'

      - --generation-config=${GENERATION_CONFIG:-vllm}
      - '--override-generation-config={"temperature":${TEMPERATURE:-0.7},"top_p":${TOP_P:-0.80},"top_k":${TOP_K:-20},"min_p":${MIN_P:-0.0},"presence_penalty":${PRESENCE_PENALTY:-1.5},"repetition_penalty":${REPETITION_PENALTY:-1.0}}'
      - --host=0.0.0.0
      - --port=8000

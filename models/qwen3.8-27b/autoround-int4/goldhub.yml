# vLLM — goldhub/Qwen3.8-27B-INT4-W4A16-AutoRound — Dual RTX 3090, TP=2, PCIe-only
#
# 27GB W4A16 AutoRound quant with Smart Layer Preservation:
#   - linear_attn.* / model.visual.* / embed_tokens / lm_head kept in FP16/BF16
#   - everything else W4A16 (group_size=32, symmetric, 1000 iters)
# Hybrid Mamba/linear-attn (48 GDN + 16 full-attn layers, mamba_ssm_dtype=float32)
# + 1 MTP layer — same family as qwen3.6-27b where MTP x prefix-cache corrupts
# recurrent-state KV (vllm#43559, vllm#47194).
#
# Base: author's 2x3090 vLLM command (HF discussion #1, goldhub, 2026-08) —
# MTP, mamba-cache-mode=align, async-scheduling, watermark=0.05, xxhash
# prefix-cache, generation-config=vllm, fp8_e4m3 KV.
#
# RE-TUNED 2026-08-18 after tool-eval-bench A/B vs Avuja/Qwen3.8-27B-int4-AutoRound
# (same base model, different quant):
#   goldhub 86/100 (118/138) vs avuja 89/100 (123/138) — 5-pt gap.
#   All 5 divergent failures were over-caution / hesitation, not quant noise:
#     TC-07  asked "who's your manager?" instead of get_contacts("manager")
#     TC-08  hallucinated a tool call as prose + fabricated a weather table
#     TC-13  broadened retry query ("proposal") instead of retrying verbatim
#     TC-68  called get_contacts to resolve "me" instead of assignee="me"
#   Root cause: author's sampling (temp 0.4, rep 1.15, presence 0.2) is tuned
#   for single-task LightRAG ingestion at max-num-seqs=36, not for 2-session
#   agentic tool-calling. Fixes: full 256K ctx, instruct sampling (temp 0.7 /
#   top_p 0.80 / presence 1.5 per Qwen3.8 README, rep 1.0), MTP k=3 (parity
#   with the winning Avuja stack), watermark off (no preemption headroom
#   needed at max-num-seqs=2).
#
# VRAM: ~13.5GB weights/card + KV at 0.92 util — fits 24GB/card.
#
# Overrides (via .env or inline):
#   MTP_K=3                  # spec tokens (3 = parity with Avuja; 2 = author's safe default)
#   PREFIX_CACHE_ARG=...     # --enable-prefix-caching (OFF by default, see below)
#   MAMBA_CACHE_MODE_ARG=--mamba-cache-mode=align  # set together with PREFIX_CACHE_ARG
#   KV_CACHE_DTYPE=fp8_e4m3  # fp8 KV uncalibrated on sm86 -> int8 safer if loops
#   MAX_MODEL_LEN=262144     # full 256K (matches winning Avuja stack)
#   ENABLE_THINKING=false    # instruct-mode default
#   TOOL_PARSER=qwen3_coder  # author uses qwen3_xml; A/B test
#   CHAT_TEMPLATE=...        # default: model's own chat_template.jinja (== froggeric v22)
services:
  vllm-qwen38-27b-autoround-int4-w4a16:
    image: vllm/vllm-openai:v0.27.1
    container_name: vllm-qwen38-27b-autoround-int4
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - /home/app/models/goldhub/Qwen3.8-27B-INT4-W4A16-AutoRound:/models/Qwen3.8-27B-INT4-W4A16-AutoRound:ro
      - /home/app/cache/vllm/torch_compile:/root/.cache/vllm/torch_compile_cache
      - /home/app/cache/vllm/triton:/root/.triton/cache
    environment:
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - NVIDIA_VISIBLE_DEVICES=all
      - OMP_NUM_THREADS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - VLLM_NO_USAGE_STATS=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - CUDA_VISIBLE_DEVICES
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    entrypoint: ["vllm", "serve"]
    command:
      - --model=/models/Qwen3.8-27B-INT4-W4A16-AutoRound
      - --served-model-name=qwen3.8-27b
      - --dtype=bfloat16
      # Quantization auto-detected from quantization_config in config.json
      # (quant_method: auto-round, packing_format: auto_round:auto_gptq).
      # Do NOT pass --quantization: vLLM's flag value would need to be
      # "auto-round" (with dash), and explicit override can mismatch the
      # GPTQ-packed weights.
      - --trust-remote-code
      # Full 256K: matches the winning Avuja stack; 52-tool defs + multi-turn
      # agentic context need the headroom (131072 was the author's ingestion
      # sweet spot and cost us the Multi-Step Chains category).
      - --max-model-len=${MAX_MODEL_LEN:-262144}
      # Prefix-caching OFF by default: MTP x prefix-cache poisons recurrent-state
      # KV on this hybrid (48 linear-attn layers) -> garbled output, runaway
      # loops, corrupted tool calls under 2+ parallel sessions (vllm#43559,
      # vllm#47194). The author's own command enables it, but our fp8 stack of
      # the same family has it off for exactly this reason.
      # Re-enable for TTFT once the MTP x prefix-cache interaction is fixed:
      #   PREFIX_CACHE_ARG=--enable-prefix-caching MAMBA_CACHE_MODE_ARG=--mamba-cache-mode=align
      - "${PREFIX_CACHE_ARG:---no-enable-prefix-caching}"
      # Author's config: xxhash + mamba 'align' cache mode are his workaround
      # for prefix-cache + MTP on this hybrid. mamba-cache-mode defaults to
      # 'none' when prefix caching is off, so only set it when re-enabling.
      - --prefix-caching-hash-algo=xxhash
      - "${MAMBA_CACHE_MODE_ARG:---mamba-cache-mode=none}"
      - --enable-chunked-prefill
      - --reasoning-parser=qwen3
      - --tensor-parallel-size=2
      - --pipeline-parallel-size=1
      - --enable-auto-tool-choice
      - --disable-custom-all-reduce
      - --gpu-memory-utilization=0.92
      - --max-num-batched-tokens=8192
      # Author uses qwen3_xml (his patched template); qwen3_coder is our
      # project standard. A/B test with TOOL_PARSER=qwen3_xml.
      - --tool-call-parser=${TOOL_PARSER:-qwen3_coder}
      # Model ships its own chat_template.jinja — use it (froggeric override
      # is untested with this quant and its template differs).
      # To use froggeric instead: mount it and set CHAT_TEMPLATE=/etc/qwen-froggeric-chat-template.jinja
      - --chat-template=${CHAT_TEMPLATE:-/models/Qwen3.8-27B-INT4-W4A16-AutoRound/chat_template.jinja}
      - '--default-chat-template-kwargs={"enable_thinking": ${ENABLE_THINKING:-false}}'
      # MTP k=3: parity with the winning Avuja stack (which runs k=3). Author
      # says k=2 is "rock-solid" and k=3 "works" — the acceptance-rate hit at
      # k=3 is small for this model and the throughput win matters for the
      # responsiveness score. Override: MTP_K=2 to fall back.
      - '--speculative-config={"method":"mtp","num_speculative_tokens":${MTP_K:-3}}'
      # Author: --generation-config vllm (use vLLM's sampling defaults as the
      # base, not the model's generation_config.json).
      - --generation-config=vllm
      # Instruct (non-thinking) sampling per Qwen3.8 README Best Practices:
      # temp 0.7, top_p 0.80, top_k 20, presence_penalty 1.5 (anti-repetition),
      # repetition_penalty 1.0. Matches the winning Avuja stack exactly.
      # The author's temp 0.4 / rep 1.15 / presence 0.2 made the model
      # over-cautious in tool-calling (hesitated to act, broadened retries,
      # fabricated tool calls as prose). NOTE: presence_penalty is a no-op
      # while MTP is on (spec-decode ignores it) — same caveat as the fp8 stack.
      - '--override-generation-config={"temperature":0.7,"top_p":0.80,"top_k":20,"min_p":0.0,"repetition_penalty":1.0,"presence_penalty":1.5}'
      # watermark OFF (default 0.0): author's 0.05 headroom is for 36-session
      # ingestion; at max-num-seqs=2 it only wastes KV blocks. async-scheduling
      # kept — it's a free GPU-gap closer with no sampling side effects.
      - --async-scheduling
      # fp8_e4m3 KV per author's config. NOTE: fp8 KV is uncalibrated on sm86
      # (checkpoint ships no q/k/v scales -> vLLM falls back to 1.0) and Ampere
      # has no native FP8 compute. If you see loops/degradation, switch to:
      # KV_CACHE_DTYPE=int8_per_token_head (what the qwen3.8-27b/fp8 stack uses)
      - --kv-cache-dtype=${KV_CACHE_DTYPE:-fp8_e4m3}
      - --host=0.0.0.0
      - --port=8000

# vLLM — Qwen3.8-27B FP8 (official Qwen quant) — Dual RTX 3090, TP=2, PCIe-only
# VRAM: ~14.5GB weights/card + ~9GB KV/card @ 0.92 util = fits 24GB cleanly
services:
  vllm-qwen38-27b:
    image: vllm/vllm-openai:v0.27.1
    container_name: vllm-qwen38-27b-fp8
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - /home/app/models/Qwen/Qwen3.8-27B-FP8:/models/Qwen3.8-27B-FP8:ro
      - /home/app/cache/vllm/torch_compile:/root/.cache/vllm/torch_compile_cache
      - /home/app/cache/vllm/triton:/root/.triton/cache
      # - /home/app/models/froggeric/Qwen-Fixed-Chat-Templates/chat_template.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
    environment:
      - OMP_NUM_THREADS=1
      - NCCL_P2P_DISABLE=1
      # - VLLM_USE_DEEP_GEMM
      - NCCL_CUMEM_HOST_ENABLE=0
      # - VLLM_SKIP_P2P_CHECK
      # - CUDA_VISIBLE_DEVICES
      - VLLM_NO_USAGE_STATS=1
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_USE_FLASHINFER_SAMPLER=0
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    command:
      - --model=/models/Qwen3.8-27B-FP8
      - --served-model-name=qwen3.8-27b
      - --dtype=bfloat16
      - --max-num-seqs=2
      - --quantization=fp8
      - --trust-remote-code
      - --max-model-len=262144
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --reasoning-parser=qwen3
      - --tensor-parallel-size=2
      - --pipeline-parallel-size=1
      - --enable-auto-tool-choice
      - --disable-custom-all-reduce
      - --gpu-memory-utilization=0.92
      - --max-num-batched-tokens=8192
      - --tool-call-parser=qwen3_coder
      - --kv-cache-dtype=fp8
      # - --chat-template=/etc/qwen-froggeric-chat-template.jinja
      - '--default-chat-template-kwargs={"enable_thinking": ${ENABLE_THINKING:-false}}'
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      - '--override-generation-config={"temperature":0.7,"top_p":0.80,"top_k":20,"min_p":0.0,"presence_penalty":1.2,"repetition_penalty":1.0}'
      - --host=0.0.0.0
      - --port=8000
